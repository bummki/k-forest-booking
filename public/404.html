<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 | 숲나들e 자연휴양림 안내</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      line-height: 1.75;
      color: #1f2937;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, #f4f7fb 0%, #eef4f1 100%);
    }

    .card {
      background: #fff;
      border: 1px solid #e5ecf3;
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 32px rgba(20, 60, 28, .08);
    }

    .tree { font-size: 52px; line-height: 1; }

    h1 {
      font-size: 26px;
      margin: 18px 0 10px;
    }

    p {
      color: #4b5563;
      font-size: 15px;
      margin: 0 0 10px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 28px;
    }

    a.btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      transition: background .15s;
    }

    a.primary { background: #047857; color: #fff; }
    a.primary:hover { background: #036249; }
    a.ghost { background: #f1f5f9; color: #1f2937; }
    a.ghost:hover { background: #e2e8f0; }

    .note {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid #e5ecf3;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="tree" aria-hidden="true">🌲</div>
    <h1>찾으시는 페이지가 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지일 수 있습니다.</p>
    <p>아래에서 원하시는 곳으로 이동해 보세요.</p>

    <div class="links">
      <a class="btn primary" href="/">전국 휴양림 목록</a>
      <a class="btn ghost" href="/ranking.html">인기 순위 TOP 20</a>
      <a class="btn ghost" href="https://www.foresttrip.go.kr" target="_blank" rel="noopener noreferrer">숲나들e 공식 예약</a>
    </div>

    <p class="note">
      휴양림 소개 글의 주소를 정리하면서 일부 페이지가 이동했습니다.
      메인 페이지의 검색창에서 휴양림 이름으로 다시 찾아보실 수 있습니다.
    </p>
  </div>
</body>

</html>
